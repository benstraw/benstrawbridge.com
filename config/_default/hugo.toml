baseURL = 'https://www.benstrawbridge.com/'
defaultContentLanguage = 'en'
enableRobotsTXT = true
languageCode = 'en-us'
summaryLength = 100
timeout = "60s"
enableEmoji = true
enableGitInfo = false
theme = 'ryder'
timeZone = "America/Los_Angeles"
refLinksErrorLevel = "WARNING"
title = "Ben Strawbridge Dot Com Consulting"
description = 'My place to work on my online projects and experiment with the web.'
copyright = '<i class="fa-regular fa-copyright"></i>  2026 benstrawbridge.com'
[imaging]
  autoOrient = true

# Not inherited from the theme, despite outputFormats being inherited. Without
# this block Hugo falls back to its own default of ["html", "rss"] and /llms.txt
# is never written.
[outputs]
  home = ["HTML", "RSS", "LLMSTxt"]

# Source document for the trail social cards. Rendered by
# layouts/trails/single.ogcard.html to /trails/<slug>/og-card.html, screenshotted
# by scripts/generate-trail-og.mjs, never linked from the site — hence
# notAlternative, and a `noindex` meta in the template itself. The distinct
# baseName is what keeps it from colliding with the page's real HTML output.
[outputFormats.OGCard]
  mediaType = "text/html"
  baseName = "og-card"
  isHTML = true
  notAlternative = true

[frontmatter]
  lastmod = ["lastmod", "date"]
  date = ["date"]
[params]
  showDate = true
  description = 'Dot Com Consulting'
  TocOpen = true
  loadLeaflet = false
  # UseHugoToc = true
  # enabledebugpanel = true 
  # navbar_fixed = true
  # homepage list exclusion... 
  # "listening" is excluded because its weekly + artist pages would swamp the
  # feed; the latest week gets its own module instead (home-listening-module).
  excludedSections = ["fineprint", "portfolio", "goals", "consulting", "everything-everywhere", "links", "listening"]
  excludedCategories = ["catalog"]
  showDarkToggle = true
  showShareButtons = true
  showSummaryMeta = false
  og_image_default = '/images/og/og_image_default.jpg'
logo_firstWord = 'Ben'
  logo_lastWord = 'Strawbridge'
  logo_tagline = "DOT COM CONSULTING"
  logo_fontClass = 'font-titillium'
  repository = "https://github.com/benstraw/benstrawbridge.com"
  amazon_associate_id = "benstrawbridge-20"
  footerLayout = "stacked"
  # cardCategoryColorsDefault = "bg-indigo-200"
  [params.shareButtons]
    networks = [ "email", "linkedin" ]
  [params.author]
    email = 'ben@benstrawbridge.com'
    name = 'Ben Strawbridge'
  [params.twClasses]
    headerBackgroundFrameOuter = "bg-gradient-to-r to-sky-300 from-indigo-300 dark:from-violet-950 dark:to-gray-900 border-b border-fuchsia-600 text-violet-950 dark:text-neutral-100"
    headerBackgroundFrameInner = "bg-header-sunset-sf-coke dark:bg-header-artist-date-two h-[200px] sm:h-[250px] bg-cover bg-bottom"
    footerBackground = "bg-gradient-to-r from-slate-950 via-neutral-950 to-zinc-900 border-emerald-500"
    # navbar_fixed = "sticky top-0"
  [params.footer]
    tagCloud = true
  # Drives the site override at layouts/partials/utils/taxonomy-string.html,
  # which orders each group by page count instead of alphabetically and then
  # caps it. minCount is the floor and applies FIRST, so it — not maxTerms — is
  # what decides the eligible pool: musical-genres has 512 terms but only 67
  # with 10+ artists. Drop maxTerms to get the theme's unbounded list back.
  #
  # Both caps land on a clean count boundary rather than slicing a group of
  # terms tied on count, because Hugo does not document how .ByCount orders
  # equal counts — a cap through a tie can reshuffle the footer between builds.
  [[params.footer.taxonomies]]
    name = "tags"
    title = "Tags"
    # 33 = every tag used 5+ times. Nine tags tie at 5, so a smaller cap would
    # show some and hide others arbitrarily. Inert at today's pool size; kept as
    # the bound for when the pool grows past it.
    minCount = 5
    maxTerms = 33
  [[params.footer.taxonomies]]
    name = "musical-genres"
    title = "Musical Genres"
    # 41 takes both 14-artist genres (red dirt, ragga) and breaks between 14
    # and 13. A cap of 40 would split that pair.
    minCount = 10
    maxTerms = 41
  [params.schema]
    # Site-wide JSON-LD entity type. Theme default is Organization; this is a
    # personal site. Per-page structured data lives in
    # layouts/partials/head/schema-extra.html.
    type = "Person"
  [params.csp]
    imgSrc = "https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com https://server.arcgisonline.com https://basemap.nationalmap.gov https://i.scdn.co"
# [[params.alphaAlert]]
#   weight = 1
#   alertType = "success"
#   alertTitle = "Ryder Theme for Hugo"
#   alertMessage = "Learn more about the theme by checking out the README on <a href='https://github.com/arts-link/ryder' class='underline'>on github.com</a>."
#   dismissable = true 
#   alertIconClass = "fa-solid fa-camera-retro"
[pagination]
  pagerSize = 24 

[markup]
  [markup.highlight]
    linenos = false
[security]
  [security.funcs]
    getenv = ['^HUGO_', '^CI$', '^PUBLIC_POSTHOG_']
[taxonomies]
  ingredient = 'ingredients'
  musical-genre = 'musical-genres'
  tag = 'tags'
  category = 'categories'
[permalinks]
  post = "/:year/:month/:title/"
  
[menu]
[[menu.recipes]]
    name = 'Why?'
    url = '/recipes/about/'
    weight = 40
[[menu.recipes]]
    name = 'Recipe Index'
    url = '/recipes/'
    weight = 30

[params.colors]
  legacyAccents = true
