theme = "ryder"
enableGitInfo = false

[params]
  env = "production"

  # Ryder v0.3.2 made highlight-github warn and degrade to a link instead of
  # killing the build, which is what a cloud session needs — api.github.com is
  # unreachable there no matter how the network is configured. Amplify builds
  # with open network, so a failure here is real and should still stop the
  # build. This replaces the site-level shortcode override that used to draw
  # the same distinction with `hugo.Environment`.
  highlightGithubStrict = true
  analytics_provider = "posthog"
  posthog_host = "https://t.benstrawbridge.com"
  posthog_ui_host = "https://us.posthog.com"

  # Deliberately no posthog_cookie_domain. The theme partial forwards it as
  # `cookie_domain` in posthog.init(), but posthog-js has no such option —
  # verified against 1.414.0, where the string appears nowhere in lib/ or any
  # dist/ bundle. It was silently dropped, so the value here only ever looked
  # like it pinned the cookie domain.
  #
  # What actually governs the domain is `cross_subdomain_cookie`, which
  # defaults to on and makes posthog-js discover the domain by probing. That
  # probe walks inward from the TLD, so its first attempt is always
  # `domain=.com` — a public suffix — and the browser logs
  #   Cookie "dmn_chk_<uuidv7>" has been rejected for invalid domain.
  # once per page load before the next attempt (.benstrawbridge.com) sticks.
  # That console line is expected and costs nothing; cookies work. Turning it
  # off means overriding layouts/partials/posthog.html to pass
  # cross_subdomain_cookie = false, which scopes cookies to www alone and
  # breaks identity continuity across any future subdomain. Not worth it.

  posthog_defaults = "2026-01-30"
  posthog_person_profiles = "identified_only"

  # Ryder v0.3.0 stopped adding 'unsafe-inline' to script-src as a side effect of
  # enabling PostHog. This site still needs it: the tour-map shortcode builds a
  # different inline script per trail page (it interpolates the GPX path and the
  # stops JSON, so a hash cannot cover it) and uses inline onclick/onmouseover
  # attributes, which no hash can ever cover. layouts/trails/single.html and
  # layouts/grid-basic/baseof.html carry inline scripts too.
  #
  # Declaring it here keeps today's effective policy byte-for-byte while making
  # the widening deliberate rather than automatic. To drop it: move those scripts
  # into assets/js/extended.js and convert the on* attributes to addEventListener,
  # passing page data via data-* attributes.
  #
  # Merges with [params.csp] in config/_default/hugo.toml, which sets imgSrc.
  [params.csp]
    scriptSrc = "'unsafe-inline'"

