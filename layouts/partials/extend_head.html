{{- /* Tour JSON-LD lives in head/schema-extra.html, the hook Ryder v0.3.0 calls
       after head/schema.html. Only the plain geo meta tags belong here. */ -}}
{{- if .Params.tour }}
  {{- with .Params.geo }}
  <meta name="geo.region" content="US-{{ .state }}" />
  <meta name="geo.placename" content="{{ .neighborhood }}{{ with .city }}, {{ . }}{{ end }}" />
  <meta name="geo.position" content="{{ .lat }};{{ .lon }}" />
  <meta name="ICBM" content="{{ .lat }}, {{ .lon }}" />
  {{- end }}
{{- end }}
