name: Amplify preview cleanup

run-name: Amplify preview cleanup · PR #${{ inputs.pr_number || github.event.pull_request.number }}

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose preview should be removed (digits only)
        required: true
        type: string

# Deliberately the same group as the deployment workflow. A close event is the
# newest run in the group, so it cancels a deployment still in flight for this
# pull request and cannot itself be cancelled by an older deployment run.
concurrency:
  group: amplify-preview-pr-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Same environment as the deployment so one OIDC trust policy covers both.
    # Do not add required reviewers unless you want cleanup to wait for approval.
    environment: amplify-preview
    permissions:
      contents: write # delete the temporary preview branch
      pull-requests: write # mark the status comment as removed
      id-token: write # request the OIDC token used to assume the AWS role
    steps:
      - name: Check out the base branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate the pull request number
        id: pr
        env:
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          pr_number="${INPUT_PR_NUMBER:-$EVENT_PR_NUMBER}"
          if [[ ! "$pr_number" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::error::pull request number must be digits only"
            exit 1
          fi
          echo "pr_number=${pr_number}" >>"$GITHUB_OUTPUT"

      - name: Assume the preview deployment role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: amplify-cleanup-pr-${{ steps.pr.outputs.pr_number }}

      - name: Remove the preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/amplify-preview/cleanup.sh
