# ---- Stories ---------------------------------------------------------------
# doors: the door pages that show the full story. The hub teaser links to the
# FIRST door listed, at #<id>.

[[stories]]
id = "zodaka"
doors = ["founders"]
title = "Zodaka: payments for cannabis businesses"
role = "Head of Product, 2017–2019"
teaser = "Payments for cannabis businesses, launched in under four months."
body = """
When I joined Zodaka, it was an idea and some code, with nothing live. Its customers were cannabis businesses, which were shut out of mainstream card processing. Working alongside the CTO, I designed the architecture, wrote code, ran code reviews, and grew the team from two people to more than five, launching a consumer mobile app and a merchant dashboard in under four months. Transaction volume then doubled every month for six straight months.
"""
bridge = ""

[[stories]]
id = "united-ctm"
doors = ["founders", "companies"]
title = "United CTM: from sprawling prototype to one working product"
role = "Fractional CPO and engineer"
teaser = "A sprawling prototype rebuilt into one working AI news pipeline."
body = """
United CTM had a huge vision for a financial platform: news aggregation, sentiment scoring, portfolios, trading and automated strategies. It also had a pile of prototypes, none of them working. I helped the founder start over and focus on one thing, the news service. We built an AI pipeline on Google Cloud that pulled in articles, summarized them with LLMs and scored them with a sentiment model. When it launched, it was a complete, complex system that ran smoothly end to end, and it became the foundation for a chat assistant that could answer questions about the news and the user's own portfolio.
"""
bridge = ""

[[stories]]
id = "gordon-landreth-photography"
doors = ["companies"]
title = "Gordon Landreth Photography: six decades of photo archives made searchable"
role = "Personal project"
teaser = "Six decades of photo albums made searchable with a local vision model."
body = """
My grandfather left 46 photo albums spanning 1931 to the 1990s: more than 3,400 scanned pages whose captions held every name, place and date, but only as pixels. I built a pipeline that finds the captions on each page and reads them with a vision model running locally, so the family's photos never left my machine. Standard OCR turned the handwritten notes into garbage, while the vision model made them readable and brought caption accuracy to about 95%. The result is instant search across the whole collection with no server or database to maintain, and family members are finding photos they'd forgotten existed.
"""
bridge = "The same approach applies to any archive of scanned documents a business can't search, from claim forms to decades of invoices."
  [[stories.links]]
  label = "Live search"
  url = "https://gordon-landreth-photography.arts-link.com/search/"
  [[stories.links]]
  label = "How it was built"
  url = "/projects/ocr-powered-search-photo-gallery/"

