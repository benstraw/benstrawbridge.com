version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run og:check
        # og:check renders a development copy into public/ so it can inspect
        # every card source. Start the deploy build from an empty destination;
        # otherwise Amplify packages stale development transforms alongside
        # the production files.
        - hugo --cleanDestinationDir --gc --minify
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      - resources/_gen/**/*
      - '!node_modules/.cache/**/*'
