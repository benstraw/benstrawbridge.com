version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - |
          if [ "$AWS_BRANCH" = "amplify-preview/pr-122" ]; then
            npm run og:review-preview
          else
            npm run og:check
            hugo --gc --minify
          fi
  artifacts:
    baseDirectory: public
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      - resources/_gen/**/*
      - '!node_modules/.cache/**/*'
